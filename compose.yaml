services:
  postgres:
    image: postgres:16
    container_name: devicemgmt-postgres
    environment:
      POSTGRES_DB: devicemgmt
      POSTGRES_USER: devicemgmt
      POSTGRES_PASSWORD: devicemgmtpass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devicemgmt -d devicemgmt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

