services:
  postgres:
    image: postgres:16
    container_name: devicemgmt-postgres
    environment:
      POSTGRES_DB: devicemgmt
      POSTGRES_USER: devicemgmt
      POSTGRES_PASSWORD: devicemgmtpass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devicemgmt -d devicemgmt"]
      interval: 5s
      timeout: 3s
      retries: 10

  simulator:
    build: ./simulator
    container_name: devicemgmt-simulator
    environment:
      # host.docker.internal lets the simulator reach a controller run outside Compose
      # (e.g. ./mvnw spring-boot:run on the host). Override if the controller is
      # containerized too.
      CONTROLLER_URL: ${CONTROLLER_URL:-http://host.docker.internal:8080}
      DEVICE_COUNT: ${DEVICE_COUNT:-1000}
      SEED: ${SEED:-42}
      OLD_VERSION: ${OLD_VERSION:-1.0.0}
      # Timing (seconds). Defaults match simulator/simulator.py.
      PERIODIC_INFORM_SEC: ${PERIODIC_INFORM_SEC:-300}
      DOWNLOAD_MIN_SEC: ${DOWNLOAD_MIN_SEC:-2}
      DOWNLOAD_MAX_SEC: ${DOWNLOAD_MAX_SEC:-20}
      REBOOT_MIN_SEC: ${REBOOT_MIN_SEC:-5}
      REBOOT_MAX_SEC: ${REBOOT_MAX_SEC:-240}
      # Callback noise (fractions 0-1).
      P_DUPLICATE: ${P_DUPLICATE:-0.05}
      P_LATE: ${P_LATE:-0.05}
      LATE_EXTRA_SEC: ${LATE_EXTRA_SEC:-600}
      # Device behaviour profiles (fractions 0-1, must sum to <= 1; remainder is healthy).
      P_OFFLINE: ${P_OFFLINE:-0.05}
      P_REJECT: ${P_REJECT:-0.03}
      P_FAULT: ${P_FAULT:-0.04}
      P_NO_TC: ${P_NO_TC:-0.03}
      P_REVERT: ${P_REVERT:-0.02}
    ports:
      - "9000:9000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:

